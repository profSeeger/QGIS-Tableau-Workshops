title: "Data and Mapping Workshops"
subtitle: ""
description: ""

baseurl: "/QGIS-Tableau-Workshops"  # Your repository name (must start with /)
url: "https://profseeger.github.io" # Your main domain

# Theme Settings
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "air"

search: false
markdown: kramdown
permalink: pretty

atom_feed:
  hide: true

collections:
  pages:
    output: true

defaults:
  - scope:
      path: ""
    values:
      layout: single
      custom_head: head/custom.html
      sidebar:
        nav: "sidebar"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
